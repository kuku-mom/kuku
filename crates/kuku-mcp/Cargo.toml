[package]
name = "kuku-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "0.8", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
kuku-memory = { path = "../kuku-memory" }
tempfile = "3"
